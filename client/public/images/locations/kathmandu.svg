<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#178577;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0F554E;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#78D5C0;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#178577;stop-opacity:0.1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="250" fill="url(#sky)"/>
  <!-- Mountains -->
  <polygon points="0,350 120,200 240,320 350,180 460,300 550,220 680,280 800,240 800,500 0,500" fill="rgba(255,255,255,0.06)"/>
  <polygon points="0,400 100,280 220,360 340,250 450,340 580,270 700,330 800,290 800,500 0,500" fill="rgba(255,255,255,0.04)"/>
  <!-- Temple silhouettes -->
  <rect x="180" y="300" width="40" height="100" rx="2" fill="rgba(255,255,255,0.1)"/>
  <polygon points="170,300 200,260 230,300" fill="rgba(255,255,255,0.1)"/>
  <polygon points="175,260 200,230 225,260" fill="rgba(255,255,255,0.08)"/>
  <rect x="380" y="320" width="35" height="80" rx="2" fill="rgba(255,255,255,0.08)"/>
  <polygon points="372,320 397,285 422,320" fill="rgba(255,255,255,0.08)"/>
  <rect x="560" y="310" width="30" height="90" rx="2" fill="rgba(255,255,255,0.07)"/>
  <polygon points="553,310 575,278 598,310" fill="rgba(255,255,255,0.07)"/>
  <!-- City buildings -->
  <rect x="100" y="380" width="60" height="50" rx="3" fill="rgba(255,255,255,0.05)"/>
  <rect x="270" y="370" width="50" height="60" rx="3" fill="rgba(255,255,255,0.06)"/>
  <rect x="440" y="375" width="55" height="55" rx="3" fill="rgba(255,255,255,0.05)"/>
  <rect x="620" y="365" width="45" height="65" rx="3" fill="rgba(255,255,255,0.06)"/>
  <!-- Dots / stars -->
  <circle cx="100" cy="80" r="2" fill="rgba(255,255,255,0.3)"/>
  <circle cx="300" cy="60" r="1.5" fill="rgba(255,255,255,0.2)"/>
  <circle cx="500" cy="90" r="2" fill="rgba(255,255,255,0.25)"/>
  <circle cx="650" cy="50" r="1.5" fill="rgba(255,255,255,0.2)"/>
  <circle cx="720" cy="110" r="2" fill="rgba(255,255,255,0.3)"/>
  <!-- Ground -->
  <rect x="0" y="440" width="800" height="60" fill="rgba(0,0,0,0.15)"/>
</svg>