<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#78D5C0;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#116B61;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#AEEAD9;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#78D5C0;stop-opacity:0.05"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="200" fill="url(#sky)"/>
  <!-- Bhaktapur Durbar - 55 Window Palace -->
  <rect x="150" y="280" width="500" height="160" rx="4" fill="rgba(255,255,255,0.08)"/>
  <!-- Roof -->
  <polygon points="130,280 400,220 670,280" fill="rgba(255,255,255,0.1)"/>
  <!-- Windows row -->
  <rect x="180" y="310" width="12" height="18" rx="2" fill="rgba(255,255,255,0.12)"/>
  <rect x="210" y="310" width="12" height="18" rx="2" fill="rgba(255,255,255,0.12)"/>
  <rect x="240" y="310" width="12" height="18" rx="2" fill="rgba(255,255,255,0.12)"/>
  <rect x="270" y="310" width="12" height="18" rx="2" fill="rgba(255,255,255,0.12)"/>
  <rect x="300" y="310" width="12" height="18" rx="2" fill="rgba(255,255,255,0.12)"/>
  <rect x="330" y="310" width="12" height="18" rx="2" fill="rgba(255,255,255,0.12)"/>
  <rect x="360" y="310" width="12" height="18" rx="2" fill="rgba(255,255,255,0.12)"/>
  <rect x="390" y="310" width="12" height="18" rx="2" fill="rgba(255,255,255,0.12)"/>
  <rect x="420" y="310" width="12" height="18" rx="2" fill="rgba(255,255,255,0.12)"/>
  <rect x="450" y="310" width="12" height="18" rx="2" fill="rgba(255,255,255,0.12)"/>
  <rect x="480" y="310" width="12" height="18" rx="2" fill="rgba(255,255,255,0.12)"/>
  <rect x="510" y="310" width="12" height="18" rx="2" fill="rgba(255,255,255,0.12)"/>
  <rect x="540" y="310" width="12" height="18" rx="2" fill="rgba(255,255,255,0.12)"/>
  <rect x="570" y="310" width="12" height="18" rx="2" fill="rgba(255,255,255,0.12)"/>
  <rect x="600" y="310" width="12" height="18" rx="2" fill="rgba(255,255,255,0.12)"/>
  <!-- Door -->
  <rect x="375" y="380" width="50" height="60" rx="3" fill="rgba(255,255,255,0.08)"/>
  <polygon points="375,380 400,360 425,380" fill="rgba(255,255,255,0.1)"/>
  <!-- Nyatapola Temple (towering pagoda on right) -->
  <rect x="650" y="200" width="60" height="240" rx="3" fill="rgba(255,255,255,0.06)"/>
  <polygon points="635,200 680,155 725,200" fill="rgba(255,255,255,0.08)"/>
  <polygon points="645,155 680,120 715,155" fill="rgba(255,255,255,0.06)"/>
  <polygon points="655,120 680,95 705,120" fill="rgba(255,255,255,0.05)"/>
  <rect x="677" y="80" width="6" height="15" fill="rgba(255,255,255,0.08)"/>
  <!-- Left structure -->
  <rect x="50" y="310" width="55" height="130" rx="3" fill="rgba(255,255,255,0.05)"/>
  <polygon points="45,310 77,275 110,310" fill="rgba(255,255,255,0.06)"/>
  <!-- Ground -->
  <rect x="0" y="440" width="800" height="60" fill="rgba(0,0,0,0.1)"/>
  <!-- Ambient -->
  <circle cx="120" cy="60" r="2" fill="rgba(255,255,255,0.25)"/>
  <circle cx="400" cy="45" r="1.5" fill="rgba(255,255,255,0.2)"/>
  <circle cx="700" cy="70" r="2" fill="rgba(255,255,255,0.3)"/>
